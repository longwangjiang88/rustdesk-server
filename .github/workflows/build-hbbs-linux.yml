name: build-hbbs-linux
on:
  workflow_dispatch:
  push:
    branches: [forapi]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-hbbs-linux.yml"
      - "Dockerfile.cross-hbbs"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - name: Build hbbs
        run: |
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          cargo build --release --bin hbbs --target x86_64-unknown-linux-musl --all-features
      - uses: actions/upload-artifact@v4
        with:
          name: hbbs-linux-amd64-musl
          path: target/x86_64-unknown-linux-musl/release/hbbs
